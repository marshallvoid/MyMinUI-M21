# NDS / desmume2015 defaults for SJGAM M21/M22 Pro (H133 dual Cortex-A7).
# Frontend keys must match workspace/all/minarch/minarch.c exactly
# (minarch_cpu_speed=Powersave/Normal/Performance/Max, thread=Off/On,
#  scaling=Native/Aspect/Extended/Fullscreen/Force 4:3/Force 3:2).
# Core option keys verified against desmume/src/libretro/libretro.cpp.
-minarch_thread_video = On
-minarch_cpu_speed = Max
# NOTE: scaling intentionally NOT hidden so the user can switch
# Aspect (default, keeps ratio) <-> Fullscreen (stretched) ingame.
# Overclock comes from launch.sh CPU_OC=MAX; hidden here would block lowering it.
-desmume_internal_resolution = 256x192
-desmume_num_cores = 1
desmume_cpu_mode = jit
desmume_jit_block_size = 12
desmume_frameskip = 2
# Default layout left/right: frame 512x192 (wide) -> Aspect scales to
# 640x240 on the 640x480 screen = FULL width, black bars top/bottom.
# Per-game override ingame: MENU > Options > Screen layout > Save for Game:
#   top/bottom  = classic stacked 256x384 (320x480, pillarboxed)
#   top only    = single 256x192 screen, FULL 640x480, no touch
#   bottom only = single 256x192 screen, FULL 640x480, touch works
#   quick switch= single screen + R3 swaps top/bottom
desmume_screens_layout = left/right
desmume_screens_gap = 0
desmume_pointer_mouse = enabled
desmume_pointer_type = touch
desmume_pointer_device_l = none
desmume_pointer_device_r = absolute
desmume_pointer_device_deadzone = 15
desmume_load_to_memory = disabled
desmume_firmware_language = Auto

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind X Button = X
bind Y Button = Y
bind L Button = L1
bind R Button = R1
# Stylus: hold L1 to show the desmume2015 absolute cursor and turn Dpad/ABXY
# into cursor keys (MapABXYtoRightStick=On below); hold R2 = stylus press
# (core ORs JOYPAD_R2 into have_touch).
# L2 is wired to the NDS Lid Close/Open button below, not touch, so it's
# not doubled up as a press trigger.
# MOUSE-MODE (joycon-as-mouse): hold L1, then Dpad AND ABXY become cursor
# keys with press-and-hold acceleration (no game input leaks while held),
# R2 still presses. Release L1 to play normally.
bind L2 Button = L2
bind R2 Button = R2
MapABXYtoRightStick = On
# Perf round 2 (H133 dual A7): no bus-level timing, preload ROM to RAM,
# rasterizer may use both cores (default 1 = stable, try 2 ingame).
desmume_advanced_timing = disabled
desmume_load_to_memory = enabled
desmume_num_cores = 1
